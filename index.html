<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c70024">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="description" content="JOYFIT24経堂の会員向けQ&A・各種手続きガイド">
  <title>JOYFIT24経堂 ご利用ガイド</title>
  <link rel="preload" as="image" href="images/app-guide/07-member-search.webp" fetchpriority="high">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#guide-content">本文へ移動</a>
  <main>
    <section class="guide-top" aria-labelledby="page-title">
      <div class="top-inner">
        <div class="top-tools">
          <div class="lang-switcher" id="lang-switcher">
            <button class="lang-toggle" id="lang-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span aria-hidden="true">🌐</span><span id="lang-current">日本語</span><span aria-hidden="true">⌄</span>
            </button>
            <div class="lang-menu" id="lang-menu" role="listbox" aria-label="Language">
              <button type="button" data-lang="ja" role="option">日本語</button>
              <button type="button" data-lang="en" role="option">English</button>
              <button type="button" data-lang="zh-CN" role="option">简体中文</button>
              <button type="button" data-lang="zh-TW" role="option">繁體中文</button>
              <button type="button" data-lang="ko" role="option">한국어</button>
            </div>
          </div>
        </div>
        <h1 id="page-title">Q&amp;A</h1>
        <label class="search-box" for="guide-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          <input id="guide-search" type="search" placeholder="キーワードで検索" autocomplete="off">
          <button id="clear-search" class="clear-search" type="button" aria-label="検索をクリア">×</button>
        </label>
      </div>
    </section>

    <section class="guide-shell">
      <section class="category-rail" aria-label="カテゴリ">
        <div class="rail-head">
          <span>項目を選択してください</span><span><b id="category-count">11</b>項目</span>
        </div>
        <nav id="category-nav" class="category-nav"></nav>
      </section>

      <div id="guide-content" class="content-column" tabindex="-1">
        <div id="search-status" class="search-status" aria-live="polite"></div>
        <div id="empty-state" class="empty-state" hidden>
          <span class="empty-icon">?</span>
          <h2>該当する項目が見つかりませんでした</h2>
          <p>言葉を短くするか、カテゴリから探してください。</p>
        </div>
        <article id="guide-panel" class="guide-panel"></article>
      </div>
    </section>
  </main>

  <script src="locales.bundle.js"></script>
  <script src="i18n.js"></script>
  <script src="site-links.js"></script>
  <script src="qa-content.js"></script>
  <script src="app-guide.js"></script>
  <script src="qa-i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
